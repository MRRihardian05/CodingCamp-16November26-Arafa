<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER: Greeting ===== -->
  <header class="header">
    <div class="header-left">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">Monday, January 1, 2026</div>
      <div id="greeting" class="greeting">Good morning!</div>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="btn btn-icon" title="Toggle light/dark mode">🌙</button>
      <button id="name-btn" class="btn btn-secondary" title="Set your name">✏️ Set Name</button>
    </div>
  </header>

  <!-- ===== NAME MODAL ===== -->
  <div id="name-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>What's your name?</h3>
      <input type="text" id="name-input" class="input" placeholder="Enter your name…" maxlength="30" />
      <div class="modal-actions">
        <button id="name-save" class="btn btn-primary">Save</button>
        <button id="name-cancel" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ===== MAIN GRID ===== -->
  <main class="grid">

    <!-- === FOCUS TIMER === -->
    <section class="card" id="timer-card">
      <h2 class="card-title">⏱ Focus Timer</h2>
      <div id="timer-display" class="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop" class="btn btn-secondary">Stop</button>
        <button id="timer-reset" class="btn btn-secondary">Reset</button>
      </div>
      <div class="timer-set">
        <label for="timer-minutes">Custom minutes:</label>
        <input type="number" id="timer-minutes" class="input input-small" value="25" min="1" max="120" />
        <button id="timer-apply" class="btn btn-secondary">Apply</button>
      </div>
    </section>

    <!-- === TO-DO LIST === -->
    <section class="card" id="todo-card">
      <h2 class="card-title">✅ To-Do List</h2>

      <div class="todo-input-row">
        <input type="text" id="todo-input" class="input" placeholder="Add a new task…" maxlength="100" />
        <button id="todo-add" class="btn btn-primary">Add</button>
      </div>

      <div class="todo-toolbar">
        <span id="todo-count" class="todo-count">0 tasks</span>
        <select id="todo-sort" class="input input-small">
          <option value="default">Default order</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="done">Done last</option>
        </select>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
    </section>

    <!-- === QUICK LINKS === -->
    <section class="card" id="links-card">
      <h2 class="card-title">🔗 Quick Links</h2>

      <div class="link-input-row">
        <input type="text" id="link-name-input" class="input" placeholder="Label (e.g. YouTube)" maxlength="30" />
        <input type="url" id="link-url-input" class="input" placeholder="https://…" />
        <button id="link-add" class="btn btn-primary">Add</button>
      </div>

      <div id="links-grid" class="links-grid"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
